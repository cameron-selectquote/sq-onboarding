name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-deploy main on demand, e.g. after rotating a Production secret/var.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply schema.sql (validates the Postgres DDL contract)
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEPLOY_FREEZE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets/vars below are scoped to the Production environment; the job
    # can't read them without this. DEPLOY_FREEZE (in `if` above) is
    # evaluated before the environment loads, so it must be a repo variable.
    environment:
      name: Production
      url: ${{ vars.PROD_URL }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      PROD_URL: ${{ vars.PROD_URL }}
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" -a -n "$PROD_URL" -a -n "$DEPLOY_KNOWN_HOSTS" -a -n "$DEPLOY_SSH_KEY" \
            || { echo "::error::Set DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_KNOWN_HOSTS, PROD_URL in the Production environment"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      # Uploads the standalone build, switches the `current` symlink, restarts
      # node.service, smoke-tests $PROD_URL/api/health (200) and /api/hires
      # (401 without a session), and rolls back on failure.
      - name: Deploy to Akamai
        timeout-minutes: 5
        # Runtime env written to the box by deploy.sh (Production environment).
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          GENIE_MODEL_ID: ${{ vars.GENIE_MODEL_ID }}
          GENIE_DEBUG: ${{ vars.GENIE_DEBUG }}
        run: scripts/deploy.sh
